<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<title>BCPSC HSC 2026</title>
<style>
:root{--bg:#f3f4f2;--card:#fff;--ink:#14171a;--mute:#646b73;--line:#e4e6e3;--soft:#f7f8f6;--acc:#0b5d3b;--acc2:#e3f1e9;--accink:#0b5d3b;--bad:#b42318;--bads:#fdecea;--gold:#8a5a00;--golds:#fff3d1;--bar:#d9ddd8;--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1211;--card:#181c1b;--ink:#e9ecea;--mute:#9aa29e;--line:#29302d;--soft:#1e2321;--acc:#3fb37a;--acc2:#16342a;--accink:#7fd9a9;--bad:#ff8a80;--bads:#3b1b19;--gold:#f0c35a;--golds:#3a2e12;--bar:#2c3431;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
header.hero{background:var(--acc);color:#fff;padding:22px 0 18px}
@media (prefers-color-scheme:dark){header.hero{background:#123d2b}}
.hero h1{margin:0;font-size:20px;line-height:1.25;letter-spacing:-.01em}
.hero p{margin:4px 0 0;opacity:.85;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.kpi{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:20px;line-height:1.1}
.kpi span{font-size:11px;opacity:.85}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search svg{flex:none;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;min-height:34px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sep{border:0;background:none;padding:0 2px;color:var(--line);cursor:default}
.jump{display:flex;gap:6px;padding-top:8px}
.jump a{flex:1;text-align:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 4px;font-size:12.5px;font-weight:600}
.jump a small{display:block;color:var(--mute);font-weight:400;font-size:11px}
section{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sh h2{margin:0;font-size:18px}
.sh .meta{color:var(--mute);font-size:12.5px;text-align:right}
.sstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ss{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.ss b{display:block;font-size:17px}
.ss span{font-size:11px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left}
.rank{flex:none;width:26px;text-align:center;font-size:12px;color:var(--mute);font-weight:600}
.who{flex:1;min-width:0}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .r{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;min-width:58px;text-align:center;border-radius:10px;padding:6px 8px;font-weight:700;font-size:15px;background:var(--acc2);color:var(--accink)}
.badge.g5{background:var(--golds);color:var(--gold)}
.badge.f{background:var(--bads);color:var(--bad);font-size:13px}
.badge small{display:block;font-size:10px;font-weight:600;opacity:.8;letter-spacing:.03em}
.chev{flex:none;color:var(--mute);transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.det{display:none;border-top:1px solid var(--line);padding:12px 14px 14px;background:var(--soft)}
.card.open .det{display:block}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:12px}
.info div{min-width:0}
.info dt{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.info dd{margin:1px 0 0;font-size:14px;overflow-wrap:anywhere}
.subs{display:flex;flex-direction:column;gap:7px}
.sub{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:4px 10px}
.sub .sn{font-size:13.5px;min-width:0}
.sub .sn small{color:var(--mute);font-size:11px;margin-left:4px}
.sub .gr{font-weight:700;font-size:13px;min-width:30px;text-align:center;border-radius:6px;padding:1px 6px;background:var(--card);border:1px solid var(--line)}
.sub .gr.F{background:var(--bads);color:var(--bad);border-color:transparent}
.sub .gr.Ap{background:var(--acc2);color:var(--accink);border-color:transparent}
.sub .mk{font-size:13px;color:var(--mute);min-width:52px;text-align:right}
.sub .bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--bar);overflow:hidden}
.sub .bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.sub .bar i.F{background:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:22px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.hide{display:none!important}
footer{color:var(--mute);font-size:12px;text-align:center;margin-top:28px}
@media (min-width:700px){.hero h1{font-size:24px}.kpi b{font-size:24px}.info{grid-template-columns:repeat(4,1fr)}.subs{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}}
@media (max-width:360px){.kpis,.sstats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function ok(r){
  if(st.f==="pass"&&r.res!=="PASS")return false;

  return !q||(r.r+" "+r.n).toLowerCase().includes(q);
